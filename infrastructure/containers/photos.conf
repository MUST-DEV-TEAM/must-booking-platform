server {
    listen 80;
    server_name _;
    location ~ /\. { return 404; }
    location /photos/ {
        alias /srv/photos/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
