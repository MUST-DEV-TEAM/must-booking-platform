name: must-booking-deploy-webhook

services:
  deploy-webhook:
    build:
      context: .
      dockerfile: deploy-webhook.Dockerfile
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PORT: 8090
      DEPLOY_SCRIPT: /deploy/infrastructure/containers/deploy.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MUST_BOOKING_CHECKOUT}:/deploy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8090/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

networks:
  proxy:
    external: true
