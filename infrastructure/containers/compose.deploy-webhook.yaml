name: must-booking-deploy-webhook

services:
  deploy-webhook:
    build:
      context: .
      dockerfile: deploy-webhook.Dockerfile
    restart: unless-stopped
    # The mounted checkout belongs to this unprivileged host account. Never run
    # git as container root: that was the source of the 2026-08-12 .git
    # ownership breakage.
    user: "${DEPLOY_UID:?set the homelab deploy user's numeric UID}:${DEPLOY_GID:?set the homelab deploy user's numeric GID}"
    group_add:
      - "${DOCKER_GID:?set the docker socket group's numeric GID}"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PORT: 8090
      DEPLOY_SCRIPT: /deploy/infrastructure/containers/deploy.sh
      # Optional: unset until Milestone 14 wires a real SENTRY_DSN for this service.
      # Deploy-drift alerting is silent (not broken) without it.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MUST_BOOKING_CHECKOUT}:/deploy
      # The checkout's local git config references this credential file by its
      # absolute host path (see CONTRIBUTING.md's homelab deploy setup), so it
      # must be mounted at that same path for git inside the container to find it.
      - ${GIT_CREDENTIALS_FILE}:${GIT_CREDENTIALS_FILE}:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8090/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

networks:
  proxy:
    external: true
