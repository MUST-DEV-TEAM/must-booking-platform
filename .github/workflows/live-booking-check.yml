name: Live booking check

# Makes one real booking for the Must Hotel test property on booking.must.al
# after every successful deploy and once a day, and checks it reaches Clock
# (demo account 16307). Never Empire Beach Resort. Test bookings are kept.
# When it fails, it opens one "live booking check failed" issue assigned to the
# owner (GitHub emails the assignee); the next passing run closes it.

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-booking-check
  cancel-in-progress: false

env:
  ISSUE_LABEL: live-booking-alert
  ALERT_ASSIGNEE: Dejvis0001

jobs:
  check:
    name: Book Must Hotel on booking.must.al
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Book a stay and check it reaches Clock
        id: book
        run: node infrastructure/live-checks/must-hotel-booking.mjs

      - name: Open or close the alert issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.book.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open_issue="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if [ "$OUTCOME" = success ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "The live booking check passes again as of $now. [Check run]($RUN_URL)"
            fi
            exit 0
          fi

          if [ -z "$open_issue" ]; then
            gh label create "$ISSUE_LABEL" --color B60205 --description 'A real test booking on booking.must.al failed' 2>/dev/null || true
            gh issue create \
              --title 'Live booking check failed on booking.must.al' \
              --label "$ISSUE_LABEL" \
              --assignee "$ALERT_ASSIGNEE" \
              --body "@$ALERT_ASSIGNEE A real test booking for Must Hotel on booking.must.al failed at $now.

          Guests may not be able to book, or bookings may not be reaching Clock. The run's summary says which step failed.

          This issue closes by itself when the check passes again.

          [Check run]($RUN_URL)"
          else
            gh issue comment "$open_issue" --body "Still failing as of $now. [Check run]($RUN_URL)"
          fi
