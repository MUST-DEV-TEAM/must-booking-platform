name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Documentation and workflow-only changes cannot change what runs in production, so merging them neither
    # re-runs the tests nor redeploys (the deploy follows this workflow). Pull requests are always tested in full.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'

permissions:
  contents: read

# A new push to the same pull request makes the previous, now outdated, run pointless. Runs on main are never
# cancelled: every merge keeps its own result, and the deploy depends on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_PORT: 3000
  DATABASE_URL: postgresql://must_booking_app:must_booking_app_dev@localhost:5432/must_booking?schema=public
  MIGRATION_DATABASE_URL: postgresql://must_booking:must_booking_dev@localhost:5432/must_booking?schema=public
  REDIS_URL: redis://localhost:6379
  WEB_APP_URL: http://localhost:3001
  QUOTE_SIGNING_SECRET: ci-only-quote-signing-secret-not-a-real-value
  INTEGRATION_CREDENTIALS_KEY: 7JsGVIPiEfyPy2jzT+B04wdH9Z0jdhnRxREXJf688so=

jobs:
  # The checks below run side by side. The required check "Build, lint, and test" (branch protection) is the
  # last job, which passes only when all of them pass.
  static:
    name: Build, lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w build

      - name: Lint workspace
        run: pnpm -w lint

      - name: Check formatting
        run: pnpm -w format:check

  # The API tests are the long part of CI. Their end-to-end specs share one database and one Redis, so within a
  # run they must go one file at a time (fileParallelism is off). Each shard has its own database and Redis, so
  # the shards can run at the same time without ever sharing them.
  api-tests:
    name: API tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: must_booking
          POSTGRES_USER: must_booking
          POSTGRES_PASSWORD: must_booking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U must_booking -d must_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        run: pnpm --filter "./packages/*" build

      - name: Apply database migrations
        run: pnpm --filter api prisma migrate deploy

      - name: Run this shard of the API tests
        run: pnpm --filter api exec vitest run --shard=${{ matrix.shard }}/4

  other-tests:
    name: Web and UI tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: must_booking
          POSTGRES_USER: must_booking
          POSTGRES_PASSWORD: must_booking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U must_booking -d must_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w build

      - name: Apply database migrations
        run: pnpm --filter api prisma migrate deploy

      - name: Run the web and UI tests
        run: pnpm --recursive --filter '!api' run test

  verify:
    name: Build, lint, and test
    needs: [static, api-tests, other-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part must have passed
        env:
          STATIC: ${{ needs.static.result }}
          API: ${{ needs.api-tests.result }}
          OTHER: ${{ needs.other-tests.result }}
        run: |
          echo "build, lint and format: $STATIC"
          echo "API tests: $API"
          echo "web and UI tests: $OTHER"
          test "$STATIC" = success && test "$API" = success && test "$OTHER" = success

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: must_booking
          POSTGRES_USER: must_booking
          POSTGRES_PASSWORD: must_booking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U must_booking -d must_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w build

      - name: Cache the test browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the test browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm --filter api prisma migrate deploy

      - name: Run browser tests
        run: pnpm e2e

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright
          retention-days: 14

  clock-staging:
    name: Clock staging tests
    runs-on: ubuntu-latest
    # Real bookings in the Clock demo account (subscription 16307, Must Hotel), never Empire.
    # One run at a time so two PRs don't race for the same demo rooms.
    concurrency:
      group: clock-staging
      cancel-in-progress: false
    env:
      CLOCK_SANDBOX_API_USER: ${{ secrets.CLOCK_SANDBOX_API_USER }}
      CLOCK_SANDBOX_API_KEY: ${{ secrets.CLOCK_SANDBOX_API_KEY }}
      CLOCK_SANDBOX_PMS_API_URL: ${{ secrets.CLOCK_SANDBOX_PMS_API_URL }}
      CLOCK_SANDBOX_BASE_API_URL: ${{ secrets.CLOCK_SANDBOX_BASE_API_URL }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: must_booking
          POSTGRES_USER: must_booking
          POSTGRES_PASSWORD: must_booking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U must_booking -d must_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check for the Clock staging keys
        id: keys
        run: |
          if [ -n "$CLOCK_SANDBOX_API_USER" ] && [ -n "$CLOCK_SANDBOX_API_KEY" ] && [ -n "$CLOCK_SANDBOX_PMS_API_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Clock staging keys are not set in GitHub secrets, so the real Clock tests were skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.keys.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        if: steps.keys.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        if: steps.keys.outputs.ready == 'true'
        run: pnpm -w build

      - name: Apply database migrations
        if: steps.keys.outputs.ready == 'true'
        run: pnpm --filter api prisma migrate deploy

      - name: Run real Clock staging tests
        if: steps.keys.outputs.ready == 'true'
        run: >-
          pnpm --filter api exec vitest run
          src/integrations/clock/clock-pms.provider.sandbox.spec.ts
          test/clock-catalog-sync.e2e.spec.ts
          test/clock-availability.e2e.spec.ts
          test/clock-booking.e2e.spec.ts
          test/clock-payment-gated-booking.e2e.spec.ts
