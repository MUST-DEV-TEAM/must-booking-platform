name: Deploy

# Builds api and web images in GitHub (the production server is too small to build
# them), pushes them to GHCR tagged with the commit sha, then deploys that sha to
# booking.must.al over SSH. Runs after CI passes on main, or by hand for any commit
# on main (pick an older sha to roll back).
#
# The deploy job only runs once the repository variable DEPLOY_ENABLED is "true" and
# the production environment has these secrets: DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Setup: infrastructure/containers/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy. Leave empty for the latest main; use an older one to roll back.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Pick the commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: pick
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          main_sha="$(git rev-parse HEAD)"
          sha="${REQUESTED:-$main_sha}"
          if ! sha="$(git rev-parse --verify --quiet "${sha}^{commit}")"; then
            echo "::error::Unknown commit: $REQUESTED"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$main_sha"; then
            echo "::error::$sha is not a commit on main."
            exit 1
          fi
          if ! git cat-file -e "$sha:infrastructure/containers/compose.release.yaml" 2>/dev/null; then
            echo "::error::$sha predates the release pipeline and cannot be deployed by it."
            exit 1
          fi
          # A newer push to main has its own CI run and deploy; never deploy older
          # code over it automatically.
          if [ "$EVENT" = workflow_run ] && [ "$sha" != "$main_sha" ]; then
            echo "Skipping $sha: main has moved on to $main_sha."
            sha=''
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }} image
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/containers/${{ matrix.app }}.Dockerfile
          push: true
          tags: ghcr.io/must-dev-team/must-booking-platform-${{ matrix.app }}:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Only the web image uses these (the api Dockerfile declares no ARGs).
          build-args: |
            API_URL=http://api:3000
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.WEB_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to booking.must.al
    needs: [resolve, build]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy, health check, roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # The token only lives as long as this job; it reaches the server on stdin.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy "$SHA" "$GHCR_USER"

      - name: Check the public site
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://booking.must.al/api/health
